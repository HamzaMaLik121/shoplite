name: ShopLite CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      catalog: ${{ steps.filter.outputs.catalog }}
      inventory: ${{ steps.filter.outputs.inventory }}
      orders: ${{ steps.filter.outputs.orders }}
      any: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.catalog == 'true' || steps.filter.outputs.inventory == 'true' || steps.filter.outputs.orders == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            catalog:
              - 'catalog-service/**'
            inventory:
              - 'inventory-service/**'
            orders:
              - 'order-service/**'

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: catalog
            context: catalog-service
          - service: inventory
            context: inventory-service
          - service: orders
            context: order-service

    steps:
      - name: Skip unchanged service
        if: needs.changes.outputs[matrix.service] != 'true'
        run: echo "No changes in ${{ matrix.service }}. Skipping."

      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.service] == 'true'

      - name: Configure AWS credentials using OIDC
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: needs.changes.outputs[matrix.service] == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_URI: 418059030300.dkr.ecr.us-east-1.amazonaws.com/${{ vars.ECR_REPOSITORY }}
          SERVICE_LIST: ${{ matrix.service }}
        run: |
          chmod +x scripts/push.sh
          ./scripts/push.sh

      - name: Trivy scan pushed image
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 418059030300.dkr.ecr.us-east-1.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
          scan-type: image
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy:
    name: Deploy changed services to EC2
    needs: [changes, build-and-push]
    if: |
      needs.changes.outputs.any == 'true' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/shoplite_deploy
          chmod 600 ~/.ssh/shoplite_deploy

      - name: Copy deployment files
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/shoplite_deploy \
            -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "mkdir -p /opt/shoplite/db"

          scp -i ~/.ssh/shoplite_deploy \
            -o StrictHostKeyChecking=accept-new \
            scripts/deploy.sh \
            "$VM_USER@$VM_HOST:/opt/shoplite/deploy.sh"

          scp -i ~/.ssh/shoplite_deploy \
            -o StrictHostKeyChecking=accept-new \
            db/init.sql \
            "$VM_USER@$VM_HOST:/opt/shoplite/db/init.sql"

      - name: Deploy only changed services
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
          CATALOG_CHANGED: ${{ needs.changes.outputs.catalog }}
          INVENTORY_CHANGED: ${{ needs.changes.outputs.inventory }}
          ORDERS_CHANGED: ${{ needs.changes.outputs.orders }}
        run: |
          SERVICES=""

          [ "$FRONTEND_CHANGED" = "true" ] && SERVICES="$SERVICES frontend"
          [ "$CATALOG_CHANGED" = "true" ] && SERVICES="$SERVICES catalog"
          [ "$INVENTORY_CHANGED" = "true" ] && SERVICES="$SERVICES inventory"
          [ "$ORDERS_CHANGED" = "true" ] && SERVICES="$SERVICES orders"

          SERVICES="$(echo "$SERVICES" | xargs)"

          echo "Deploying: $SERVICES"

          ECR_URI="418059030300.dkr.ecr.us-east-1.amazonaws.com/${{ vars.ECR_REPOSITORY }}"

          ssh -i ~/.ssh/shoplite_deploy \
            -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "chmod +x /opt/shoplite/deploy.sh && \
             IMAGE_TAG='$IMAGE_TAG' \
             AWS_REGION='$AWS_REGION' \
             ECR_REPOSITORY_URI='$ECR_URI' \
             SERVICE_LIST='$SERVICES' \
             /opt/shoplite/deploy.sh"
