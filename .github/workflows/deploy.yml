# Build the four images, push them to ECR with the commit SHA as the tag, then
# tell the VM to pull that tag and restart the stack.
#
# Nothing here contains secrets: AWS access comes from OIDC (no long-lived
# keys) and the VM details come from the "production" environment's secrets.
#
# Required repository/environment secrets:
#   AWS_ROLE_ARN   IAM role GitHub may assume, trusted for this repo
#   VM_HOST        public address of the instance
#   VM_USER        ssh user (ubuntu)
#   VM_SSH_KEY     private key for that user
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 418059030300.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test-and-lint:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            catalog-service/package-lock.json
            frontend/package-lock.json

      - name: Catalog tests
        working-directory: catalog-service
        run: npm ci && npm test --if-present

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: inventory-service/go.mod
      - name: Inventory vet and test
        working-directory: inventory-service
        run: go vet ./... && go test ./...

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Orders tests
        working-directory: order-service
        run: mvn -B --no-transfer-progress test

  build-and-push:
    name: Build and push ${{ matrix.service }}
    needs: test-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: catalog
            context: catalog-service
          - service: inventory
            context: inventory-service
          - service: orders
            context: order-service
    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials; no AWS keys stored in GitHub.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/shop-${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" "${{ matrix.context }}"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "### shop-${{ matrix.service }}:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to the VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull the new tag and restart
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" \
            "cd ~/shoplite && \
             git pull --ff-only && \
             aws ecr get-login-password --region '${{ env.AWS_REGION }}' | \
               docker login --username AWS --password-stdin '${{ env.ECR_REGISTRY }}' && \
             TAG='$TAG' REGISTRY='${{ env.ECR_REGISTRY }}' ./scripts/up.sh"
