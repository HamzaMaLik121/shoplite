name: ShopLite CI

on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      catalog: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.catalog }}
      inventory: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.inventory }}
      orders: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.orders }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            catalog:
              - 'catalog-service/**'
            inventory:
              - 'inventory-service/**'
            orders:
              - 'order-service/**'

  test:
    name: CI - ${{ matrix.service }}
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.catalog == 'true' ||
      needs.changes.outputs.inventory == 'true' ||
      needs.changes.outputs.orders == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            budget: 60
          - service: catalog
            context: catalog-service
            dockerfile: catalog-service/Dockerfile
            budget: 200
          - service: inventory
            context: inventory-service
            dockerfile: inventory-service/Dockerfile
            budget: 30
          - service: orders
            context: order-service
            dockerfile: order-service/Dockerfile
            budget: 300

    steps:
      - name: Skip unchanged service
        if: needs.changes.outputs[matrix.service] != 'true'
        run: echo "No changes in ${{ matrix.service }}. Skipping."

      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.service] == 'true'

      - name: Hadolint
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

      - name: Build image
        if: needs.changes.outputs[matrix.service] == 'true'
        run: docker build -t shop-${{ matrix.service }}:ci ${{ matrix.context }}

      - name: Check image size budget
        if: needs.changes.outputs[matrix.service] == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          BUDGET_MB: ${{ matrix.budget }}
        run: |
          SIZE_BYTES=$(docker image inspect "shop-$SERVICE:ci" --format '{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1000000))
          echo "shop-$SERVICE is ${SIZE_MB} MB (budget ${BUDGET_MB} MB)"
          if [ "$SIZE_MB" -gt "$BUDGET_MB" ]; then
            echo "::error::shop-$SERVICE is ${SIZE_MB} MB, over the ${BUDGET_MB} MB budget"
            exit 1
          fi
