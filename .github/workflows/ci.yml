name: ShopLite CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      catalog: ${{ steps.filter.outputs.catalog }}
      inventory: ${{ steps.filter.outputs.inventory }}
      orders: ${{ steps.filter.outputs.orders }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            catalog:
              - 'catalog-service/**'
            inventory:
              - 'inventory-service/**'
            orders:
              - 'order-service/**'

  test:
    name: CI - ${{ matrix.service }}
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.catalog == 'true' ||
      needs.changes.outputs.inventory == 'true' ||
      needs.changes.outputs.orders == 'true'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            budget: 60
          - service: catalog
            context: catalog-service
            dockerfile: catalog-service/Dockerfile
            budget: 200
          - service: inventory
            context: inventory-service
            dockerfile: inventory-service/Dockerfile
            budget: 30
          - service: orders
            context: order-service
            dockerfile: order-service/Dockerfile
            budget: 300

    steps:
      - name: Skip unchanged service
        if: needs.changes.outputs[matrix.service] != 'true'
        run: echo "No changes in ${{ matrix.service }}. Skipping."

      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.service] == 'true'

      - name: Hadolint
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

      - name: Build image
        if: needs.changes.outputs[matrix.service] == 'true'
        run: |
          docker build \
            --platform linux/amd64 \
            -t shoplite-${{ matrix.service }}:ci \
            ${{ matrix.context }}

      - name: Check image size
        if: needs.changes.outputs[matrix.service] == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          BUDGET: ${{ matrix.budget }}
        run: |
          SIZE=$(docker image inspect \
            shoplite-${SERVICE}:ci --format='{{.Size}}')

          SIZE_MB=$((SIZE / 1000000))

          echo "$SERVICE image: ${SIZE_MB} MB"
          echo "Budget: ${BUDGET} MB"

          if [ "$SIZE" -gt "$((BUDGET * 1000000))" ]; then
            echo "Image exceeds size budget"
            exit 1
          fi

      - name: Trivy critical vulnerability scan
        if: needs.changes.outputs[matrix.service] == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shoplite-${{ matrix.service }}:ci
          scan-type: image
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
