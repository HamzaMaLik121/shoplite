# Rendered by the nginx image's template feature on container start:
# ${SERVER_NAME} becomes shoplite.test locally, the team's domain on the VM.

# Fallback server: any Host header other than SERVER_NAME (including the bare
# IP) gets no response at all. This is what proves the app is reached by name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    # SERVER_ALIASES is empty locally and holds the VM's public IP on a cloud host.
    server_name ${SERVER_NAME} ${SERVER_ALIASES};

    root /usr/share/nginx/html;
    index index.html;

    # Used by the image HEALTHCHECK.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Strip the /api/<service> prefix and forward over frontend-net.
    location /api/catalog/ {
        proxy_pass http://catalog:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/inventory/ {
        proxy_pass http://inventory:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/orders/ {
        proxy_pass http://orders:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
